name: macOS checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust tools
        run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build app and USB launcher
        run: |
          zsh -n build-app.sh install-background.sh
          zsh build-app.sh "$RUNNER_TEMP/Pixy Control.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/Pixy Control.app"
