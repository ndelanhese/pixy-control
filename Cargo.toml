[package]
name = "pixy-control"
version = "0.1.0"
edition = "2021"
description = "Local USB controls for EMEET PIXY on macOS"
license = "MIT"
repository = "https://github.com/ndelanhese/pixy-control"
publish = false

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
hidapi = { version = "2.6", default-features = false, features = ["macos-shared-device"] }
rusb = { version = "0.9", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
cpal = "0.15"
objc = "0.2"
block = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
